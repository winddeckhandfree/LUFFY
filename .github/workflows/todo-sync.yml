name: Sync README TODO list

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-todos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze TODOs
        env:
          APPLY: "false"
        run: python3 .github/scripts/update_todo

      - name: Show README diff
        if: always()
        run: git diff -- README.md || true
